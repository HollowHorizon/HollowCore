name: build
on:
  push:
    branches: [ "1.20.1" ]
  pull_request:
    branches: [ "1.20.1" ]

env:
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        java: [ 21 ]
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    if: |
      !contains(github.event.head_commit.message, '[no ci]')
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get the mod version from gradle.properties
        id: get_version
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          echo "mod_version=$MOD_VERSION" >> $GITHUB_OUTPUT
          echo "MOD_VERSION=$MOD_VERSION" >> $GITHUB_ENV

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v1
        with:
          java-version: ${{ matrix.java }}

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build mod
        uses: gradle/gradle-build-action@v2
        with:
          arguments: chiseledBuildAndCollect

      - name: Capture build artifacts
        if: ${{ runner.os == 'Linux' && matrix.java == '21' }}
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            merged/*.jar
            !merged/*-dev.jar
            !merged/*-sources.jar

      - name: Create GitHub Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          name: "HollowCore 1.20.1 - v${{ steps.get_version.outputs.mod_version }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "v${{ steps.get_version.outputs.mod_version }}"
          removeArtifacts: true
          allowUpdates: true
          generateReleaseNotes: true
          artifacts: "merged/*.jar"
          artifactContentType: application/java-archive

      - name: Notify Discord on success
        if: success()
        run: |
          COMMIT_TITLE=$(git log -1 --pretty=%s)
          COMMIT_BODY=$(git log -1 --pretty=%b)
          VERSION=${{ steps.get_version.outputs.mod_version }}
          curl -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "✅ Новый релиз HollowCore v$VERSION опубликован!" \
              --arg url "${{ github.server_url }}/${{ github.repository }}/releases/tag/v$VERSION" \
              --arg commit "${{ github.sha }}" \
              --arg commitTitle "$COMMIT_TITLE" \
              --arg commitBody "$COMMIT_BODY" \
              --arg date "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
              '{
                embeds: [
                  {
                    title: $title,
                    description: "**Версия:** `v\($VERSION)`\n**Коммит:** `\($commit)`\n**Сообщение:** \($commitTitle)\n\($commitBody)\n\n[🔗 Открыть релиз](\($url))",
                    color: 5763719,
                    timestamp: $date
                  }
                ]
              }')"

      - name: Notify Discord on failure
        if: failure()
        run: |
          COMMIT_TITLE=$(git log -1 --pretty=%s)
          COMMIT_BODY=$(git log -1 --pretty=%b)
          curl -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "❌ Сборка HollowCore не удалась" \
              --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --arg commit "${{ github.sha }}" \
              --arg commitTitle "$COMMIT_TITLE" \
              --arg commitBody "$COMMIT_BODY" \
              --arg date "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
              '{
                embeds: [
                  {
                    title: $title,
                    description: "**Коммит:** `\($commit)`\n**Сообщение:** \($commitTitle)\n\($commitBody)\n\n[📋 Открыть логи](\($url))",
                    color: 15548997,
                    timestamp: $date
                  }
                ]
              }')"
