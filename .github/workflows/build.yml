name: build
on:
  push:
    branches: [ "1.20.1" ]
  pull_request:
    branches: [ "1.20.1" ]

env:
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

permissions:
  contents: write

jobs:
  create_tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - name: Get the mod version from gradle.properties
        id: get_version
        run: |
          MOD_VERSION=$(grep '^modVersion=' gradle.properties | cut -d'=' -f2)
          echo "MOD_VERSION=$MOD_VERSION" >> $GITHUB_ENV

      - name: Delete existing tag if it exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Удаляем тег, если он уже существует
          git tag -d "$MOD_VERSION" || true
          git push origin --delete "$MOD_VERSION" || true

      - name: Create and push new tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Создаём новый тег с версией мода
          git tag "$MOD_VERSION"
          git push origin "$MOD_VERSION"
  build:
    strategy:
      matrix:
        java: [ 21 ]
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    needs: create_tag
    if: |
      !contains(github.event.head_commit.message, '[no ci]')
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get the mod version from gradle.properties
        id: get_version
        run: |
          MOD_VERSION=$(grep '^modVersion=' gradle.properties | cut -d'=' -f2)
          echo "mod_version=$MOD_VERSION" >> $GITHUB_OUTPUT
          echo "MOD_VERSION=$MOD_VERSION" >> $GITHUB_ENV

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v1
        with:
          java-version: ${{ matrix.java }}

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14.2'

      - name: Build Mod
        run: gradle buildAndCollect
      - name: Capture build artifacts
        if: ${{ runner.os == 'Linux' && matrix.java == '21' }}
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            merged/*.jar
            !merged/*-dev.jar
            !merged/*-sources.jar
      - name: Create GitHub Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          name: "HollowCore [1.20.1 - 1.21.1] - v${{ steps.get_version.outputs.mod_version }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "v${{ steps.get_version.outputs.mod_version }}"
          removeArtifacts: true
          allowUpdates: true
          generateReleaseNotes: true
          artifacts: "merged/*.jar"
          artifactContentType: application/java-archive
  discord-notify:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: Notify Discord on success
        if: success()
        env:
          VERSION: ${{ steps.get_version.outputs.mod_version }}

        run: |
          COMMIT_TITLE=$(git log -1 --pretty=%s)
          COMMIT_BODY=$(git log -1 --pretty=%b)
          curl -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "✅ Новый релиз HollowCore v$VERSION опубликован!" \
              --arg url "${{ github.server_url }}/${{ github.repository }}/releases/tag/v$VERSION" \
              --arg VERSION "$VERSION" \
              --arg commit "${{ github.sha }}" \
              --arg commitTitle "$COMMIT_TITLE" \
              --arg commitBody "$COMMIT_BODY" \
              --arg date "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
              '{
                embeds: [
                  {
                    title: $title,
                    description: "**Версия:** `v\($VERSION)`\n**Коммит:** `\($commit)`\n**Сообщение:** \($commitTitle)\n\($commitBody)\n\n[🔗 Открыть релиз](\($url))",
                    color: 5763719,
                    timestamp: $date
                  }
                ]
              }')"

      - name: Notify Discord on failure
        if: failure()
        run: |
          COMMIT_TITLE=$(git log -1 --pretty=%s)
          COMMIT_BODY=$(git log -1 --pretty=%b)
          curl -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "❌ Сборка HollowCore не удалась" \
              --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --arg commit "${{ github.sha }}" \
              --arg commitTitle "$COMMIT_TITLE" \
              --arg commitBody "$COMMIT_BODY" \
              --arg date "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
              '{
                embeds: [
                  {
                    title: $title,
                    description: "**Коммит:** `\($commit)`\n**Сообщение:** \($commitTitle)\n\($commitBody)\n\n[📋 Открыть логи](\($url))",
                    color: 15548997,
                    timestamp: $date
                  }
                ]
              }')"